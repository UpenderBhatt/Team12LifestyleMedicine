<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register</title>
    <link th:href="@{/styles/css/lifestyleWeb.css}" rel="stylesheet">
    <link th:href="@{/styles/css/LoginRegister.css}" rel="stylesheet">
</head>

<body class="auth-body">

<div class="auth-card">
    <h2>Register</h2>

    <form class="auth-form" th:action="@{/register}" th:object="${user}" method="post">
        <label>Username:</label>
        <input type="text" th:field="*{username}" />

        <label>Email:</label>
        <input type="text" th:field="*{email}" />

        <label>Password:</label>
        <input type="password" th:field="*{password}" />

        <button class="auth-submit" type="submit">Register</button>
    </form>

    <a class="auth-link" href="/login" style="text-align: center;">Already have an account? Click here to Sign In!</a>

    <p class="message" th:if="${param.error}" style="color: #d32f2f; text-align: center;">
        Username or password already in use.
    </p>
</div>

</body>
</html>
