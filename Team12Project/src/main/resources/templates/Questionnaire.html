<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Health Questionnaire</title>
    <link th:href="@{/styles/css/lifestyleWeb.css}" rel="stylesheet">
    <link th:href="@{/styles/css/questionnaire.css}" rel="stylesheet">
</head>
<body class="questionnaire-body">

<div id="loading-Overlay" class="hidden">
    <div class="loader"></div>
    <p>Generating your account and creating your personalised exercise plan!<br>
    This can take a few seconds so please be patient and do not close or refresh the page!</p>
</div>

<div class="questionnaire-card">
    <h1>Health Questionnaire</h1>

    <div id="progressContainer">
        <div id="progressBar"></div>
    </div>

    <div id="progressText"></div>
    <form id="questionnaireForm" action="answers" method="post">
        <div class="question active">
            <label for="gender">What is your gender?</label>
            <input type="text" id="gender" name="1" required>
            <div class="question-buttons">
                <button type="button" onclick="nextQuestion()">Next</button>
            </div>
        </div>

        <div class="question">
            <label for="age">What is your age?</label>
            <input type="number" id="age" name="2" required>
            <div class="question-buttons">
                <button type="button" onclick="nextQuestion()">Next</button>
                <button type="button" class="prev" onclick="prevQuestion()">Previous</button>
            </div>
        </div>

        <div class="question">
            <label for="bmi">BMI:</label>
            <input type="number" id="bmi" name="3" step="0.1" required>
            <div class="question-buttons">
                <button type="button" onclick="nextQuestion()">Next</button>
                <button type="button" class="prev" onclick="prevQuestion()">Previous</button>
            </div>
        </div>

        <div class="question">
            <label for="healthConditions">What are your health conditions</label>
            <input type="text" id="healthConditions" name="4" placeholder="List any relevant conditions" required>
            <div class="question-buttons">
                <button type="button" onclick="nextQuestion()">Next</button>
                <button type="button" class="prev" onclick="prevQuestion()">Previous</button>
            </div>
        </div>

        <div class="question">
            <label for="nutritionHabits">How many fruit/vegetables do you eat daily?</label>
            <input type="text" id="nutritionHabits" name="5" required>
            <div class="question-buttons">
                <button type="button" onclick="nextQuestion()">Next</button>
                <button type="button" class="prev" onclick="prevQuestion()">Previous</button>
            </div>
        </div>

        <div class="question">
            <label for="sleepQuality">How many hours of sleep do you get per night?</label>
            <input type="text" id="sleepQuality" name="6" required>
            <div class="question-buttons">
                <button type="button" onclick="nextQuestion()">Next</button>
                <button type="button" class="prev" onclick="prevQuestion()">Previous</button>
            </div>
        </div>

        <div class="question">
            <label for="stressLevels">How often do you feel stressed?</label>
            <input type="text" id="stressLevels" name="7" required>
            <div class="question-buttons">
                <button type="button" onclick="nextQuestion()">Next</button>
                <button type="button" class="prev" onclick="prevQuestion()">Previous</button>
            </div>
        </div>

        <div class="question">
            <label>Which level of experience would you say you have when it comes to exercise?</label>

            <div class="option">
                <input type="radio" id="beginner" name="8" value="Beginner" required>
                <label for="beginner" class="option-box">Beginner</label>
            </div>

            <div class="option">
                <input type="radio" id="intermediate" name="8" value="Intermediate" required>
                <label for="intermediate" class="option-box">Intermediate</label>
            </div>

            <div class="option">
                <input type="radio" id="advanced" name="8" value="Advanced" required>
                <label for="advanced" class="option-box">Advanced</label>
            </div>

            <div class="question-buttons">
                <button type="button" onclick="nextQuestion()">Next</button>
                <button type="button" class="prev" onclick="prevQuestion()">Previous</button>
            </div>
        </div>

        <div class="question">
            <label for="substanceUse">Do you smoke cigarettes?</label>
            <input type="text" id="substanceUse" name="9" required>
            <div class="question-buttons">
                <button type="button" onclick="nextQuestion()">Next</button>
                <button type="button" class="prev" onclick="prevQuestion()">Previous</button>
            </div>
        </div>

        <div class="question">
            <label for="alcoholIntake">Do you drink alcohol?</label>
            <input type="text" id="alcoholIntake" name="10" required>
            <div class="question-buttons">
                <button type="button" onclick="nextQuestion()">Next</button>
                <button type="button" class="prev" onclick="prevQuestion()">Previous</button>
            </div>
        </div>

        <div class="question">
            <label for="achieve">What do you want to achieve?</label>
            <input type="text" id="achieve" name="11" required>
            <div class="question-buttons">
                <button type="button" onclick="nextQuestion()">Next</button>
                <button type="button" class="prev" onclick="prevQuestion()">Previous</button>
            </div>
        </div>

        <div class="question">
            <label for="reason">Why do you want to achieve this?</label>
            <input type="text" id="reason" name="12" required>
            <div class="question-buttons">
                <button type="button" onclick="nextQuestion()">Next</button>
                <button type="button" class="prev" onclick="prevQuestion()">Previous</button>
            </div>
        </div>

        <div class="question">
            <label for="confidenceLevel">On a scale of 1-10, how confident are you in making lifestyle changes?</label>
            <input type="number" id="confidenceLevel" name="13" min="1" max="10" required>
            <div class="question-buttons">
                <button type="button" onclick="nextQuestion()">Next</button>
                <button type="button" class="prev" onclick="prevQuestion()">Previous</button>
            </div>
        </div>

        <div class="question">
            <label for="readinessLevel">On a scale of 1-10, how ready are you to make changes now?</label>
            <input type="number" id="readinessLevel" name="14" min="1" max="10" required>
            <div class="question-buttons">
                <button type="button" class="prev" onclick="prevQuestion()">Previous</button>
                <button type="submit">Submit Questionnaire</button>
            </div>
        </div>
    </form>

</div>

<script>
    let current = 0;
    const questions = document.querySelectorAll(".question");
    const progressBar = document.getElementById("progressBar");
    const progressText = document.getElementById("progressText");
    const form = document.getElementById("questionnaireForm");
    const loadingOverlay = document.getElementById("loading-Overlay");

    let isSubmitting = false;

    function clearError(questionEl) {
        const existing = questionEl.querySelector(".error");
        if (existing) existing.remove();
    }

    function showError(questionEl, message) {
        clearError(questionEl);
        const err = document.createElement("div");
        err.className = "error";
        err.textContent = message;
        questionEl.appendChild(err);
    }

    // returns true if inputs in current question are valid (not empty)
    function validateCurrentQuestion() {
        const q = questions[current];
        clearError(q);

        // collect inputs and radios inside this question
        const inputs = q.querySelectorAll("input, textarea, select");

        if (inputs.length === 0) {
            // nothing to validate here
            return true;
        }

        // For radio groups we need to check by name: if any radio in this question is checked -> ok
        // We'll group radios by name and treat others individually.
        const radiosByName = {};
        for (const inp of inputs) {
            if (inp.type === "radio") {
                radiosByName[inp.name] = radiosByName[inp.name] || [];
                radiosByName[inp.name].push(inp);
            }
        }

        // validate radios
        for (const name in radiosByName) {
            const group = radiosByName[name];
            const checked = group.some(r => r.checked);
            if (!checked) {
                showError(q, "Please choose an option before continuing.");
                return false;
            }
        }

        // validate non-radio inputs
        for (const inp of inputs) {
            if (inp.type === "radio") continue; // already handled
            // skip buttons
            if (inp.type === "button" || inp.type === "submit") continue;

            // Use value presence as validation (trim for text-like inputs)
            const val = inp.value;
            if (typeof val === "string") {
                if (val.trim() === "") {
                    showError(q, "Please fill out this field before continuing.");
                    return false;
                }
            } else {
                // for non-string (unlikely), do a simple empty check
                if (!val && val !== 0) {
                    showError(q, "Please fill out this field before continuing.");
                    return false;
                }
            }
        }

        // all checks passed
        return true;
    }

    function nextQuestion() {
        // validate current question first
        if (!validateCurrentQuestion()) {
            return; // stop here if validation fails
        }

        questions[current].classList.remove("active");
        current++;

        if (current < questions.length) {
            questions[current].classList.add("active");
        }
        updateProgress();
    }

    function prevQuestion() {
        if (current > 0) {
            questions[current].classList.remove("active");
            current--;
            questions[current].classList.add("active");
            updateProgress();
        }
    }

    function updateProgress() {
        const progress = ((current + 1) / questions.length) * 100;
        progressBar.style.width = progress + "%";
        progressText.textContent = `Question ${current + 1} of ${questions.length}`;
    }

    updateProgress();

        function showLoading(){
            loadingOverlay.classList.remove("hidden")

            form.querySelectorAll("input, button").forEach(el => {
                el.disabled = true;
            });
        }

        function hideLoading() {
            loadingOverlay.classList.add("hidden");
            form.querySelectorAll("input, button").forEach(el => {
                el.disabled = false;
            });
        }


    // final validation of all questions before submit
    function validateAllQuestions() {
        // iterate through every question and check its inputs
        for (let i = 0; i < questions.length; i++) {
            const q = questions[i];
            // temporarily set current so validateCurrentQuestion uses the right question
            const prevCurrent = current;
            current = i;
            if (!validateCurrentQuestion()) {
                // switch visible question to the offending one so the user can fix it
                questions[prevCurrent].classList.remove("active");
                q.classList.add("active");
                updateProgress();
                current = i;
                return false;
            }
            // clear any errors for this question so they don't persist
            clearError(q);
            current = prevCurrent;
        }
        return true;
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();

        if(isSubmitting){
            return;
        }

        // final check: ensure every question has been filled
        if (!validateAllQuestions()) {
            return;
        }

        isSubmitting = true;

        const formData = new FormData(event.target);
        const answers = [];

        for (let [questionId, response] of formData.entries()) {
            answers.push({questionId: parseInt(questionId, 10), response: response});
        }

        showLoading();

        //Variables storing csrf token and header
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content;

        try {
            const res = await fetch("/register/questionnaire", {
                method: "POST",
                headers: {"Content-Type": "application/json", [csrfHeader]: csrfToken},
                body: JSON.stringify(answers)
            });

            if (!res.ok) {
                const text = await res.text();
                throw new Error("Server error: " + res.status + " - " + text);
            }

            window.location.href = "/login?success";
        } catch (err) {
            console.error(err);
            alert("Failed to submit answers: " + err.message);
            hideLoading();
            isSubmitting = false;
        }
    });
</script>
</body>
</html>
