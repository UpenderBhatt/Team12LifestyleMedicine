<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Appointments</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/styles/css/lifestyleWeb.css}" rel="stylesheet">
    <link th:href="@{/styles/css/appointments-page.css}" rel="stylesheet">


</head>
<body>
<div th:replace="fragments/navbar :: navbar('appointments')"></div>

<div class="main-content">

    <div class="app-page-wrapper">

        <div class="app-page-header">
            <h1 class="app-page-title">Make an Appointment</h1>
        </div>

        <div class="app-card">
            <h2 class="app-card-title">Create an Appointment</h2>

            <form th:action="@{/appointments}" th:object="${appointment}" method="post">

                <div>
                    <label>Patient name</label>
                    <input type="text" th:field="*{patientName}">
                </div>

                <div>
                    <label>Patient email</label>
                    <input type="email" th:field="*{patientEmail}">
                </div>

                <div>
                    <label>Date</label>
                    <input type="date" th:field="*{date}">
                </div>

                <div>
                    <label>Time</label>
                    <input type="time" th:field="*{time}">
                </div>

                <div>
                    <label>Message</label>
                    <textarea rows="3" th:field="*{message}"></textarea>
                </div>

                <div th:if="${#fields.hasErrors()}">
                    <ul>
                        <li th:each="err : ${#fields.errors('*')}"
                            th:text="${err}">
                        </li>
                    </ul>
                </div>

                <button type="submit" class="app-submit-btn">Submit</button>
            </form>

        </div>

        <div class="app-card">
            <h2 class="app-card-title app-list-header">Upcoming Appointments</h2>

            <table>
                <thead>
                <tr>
                    <th>Patient</th>
                    <th>Email</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Message</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="appt : ${appointments}">
                    <td th:text="${appt.patientName}"></td>
                    <td th:text="${appt.patientEmail}"></td>
                    <td th:text="${appt.date}"></td>
                    <td th:text="${appt.time}"></td>
                    <td th:text="${appt.message}"></td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>


</div>

</body>
</html>
